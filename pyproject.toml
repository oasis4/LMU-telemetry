[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmu-telemetry"
version = "1.0.0.dev0"
description = "Telemetry analysis for Le Mans Ultimate"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5",
    "numpy>=1.24",
    # corners.py uses scipy.signal.find_peaks. Until now this happened to be
    # installed by the legacy backend's requirements.txt, so the package
    # imported only because something else pulled it in.
    "scipy>=1.11",
    # api/ is part of the package, so its dependencies are the package's.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# httpx backs fastapi.testclient; without it the api tests cannot run at all.
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
lmu-telemetry = "lmu_telemetry.api.__main__:main"

[tool.setuptools.packages.find]
include = ["lmu_telemetry*"]

[tool.setuptools.package-data]
lmu_telemetry = ["data/tracks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "corpus: test requires the full local telemetry corpus",
]
