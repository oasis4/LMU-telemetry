name: Windows portable package
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/windows-portable-package']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and smoke-test portable package
        shell: pwsh
        run: |
          try {
            & ./packaging/build-windows.ps1 2>&1 | Tee-Object -FilePath windows-build.log
          } catch {
            $details = (Get-Content windows-build.log -Tail 35 -ErrorAction SilentlyContinue | Out-String) + $_.Exception.Message
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging failed::$details"
            throw
          }
      - name: Python tests
        shell: pwsh
        run: |
          .venv-build/Scripts/python.exe -m pip install pytest==8.4.2 httpx==0.28.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-build/Scripts/python.exe -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend tests
        run: npm --prefix frontend test
      - uses: actions/upload-artifact@v4
        with:
          name: LMU-Telemetry-windows-x64
          path: dist/LMU-Telemetry-windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LMU-Telemetry-windows-x64
          path: release-assets
      - name: Publish Windows ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset="release-assets/LMU-Telemetry-windows-x64.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$asset" \
              --verify-tag --generate-notes --title "LMU Telemetry $RELEASE_TAG" \
              "${options[@]}"
          fi
